name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only, and no secrets are used: it is safe to run on pull requests from forks.
permissions:
  contents: read

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
