name: Bug report
description: Something isn't working as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please **don't include real people's names, phone numbers or locations**.
        For a security problem, don't use this form: see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the site
        2. Press "I'm coming too"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: map
    attributes:
      label: Which map view?
      options: [Map (default), Dark, 3D, Not about the map]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 14, Safari 17 / Windows laptop, Chrome 130
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
      description: Drag images in here. For console errors, open the browser's developer tools and copy any red messages.
